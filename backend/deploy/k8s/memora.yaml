# Minimal Kubernetes manifests (Phase 14). Apply after Docker Compose is stable.
apiVersion: v1
kind: Namespace
metadata:
  name: memora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memora-config
  namespace: memora
data:
  APP_NAME: Enterprise AI Assistant
  APP_VERSION: 1.0.0
  NODE_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
---
apiVersion: v1
kind: Secret
metadata:
  name: memora-secrets
  namespace: memora
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/memora
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memora-api
  namespace: memora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memora-api
  template:
    metadata:
      labels:
        app: memora-api
    spec:
      containers:
        - name: api
          image: memora-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: memora-config
            - secretRef:
                name: memora-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: memora-api
  namespace: memora
spec:
  selector:
    app: memora-api
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memora-worker
  namespace: memora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memora-worker
  template:
    metadata:
      labels:
        app: memora-worker
    spec:
      containers:
        - name: worker
          image: memora-backend:latest
          envFrom:
            - configMapRef:
                name: memora-config
            - secretRef:
                name: memora-secrets
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memora-api-hpa
  namespace: memora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memora-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memora-api-pdb
  namespace: memora
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: memora-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memora-ingress
  namespace: memora
spec:
  rules:
    - host: memora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memora-api
                port:
                  number: 80
